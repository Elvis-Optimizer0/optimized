name: Build Zytech Boost

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ZytechBoost/ZytechBoost.csproj

    - name: Build (Debug)
      run: dotnet build ZytechBoost/ZytechBoost.csproj -c Debug --no-restore

    - name: Build (Release)
      run: dotnet build ZytechBoost/ZytechBoost.csproj -c Release --no-restore

    - name: Publish self-contained exe
      run: |
        dotnet publish ZytechBoost/ZytechBoost.csproj `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:EnableCompressionInSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -c Release `
          -o publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZytechBoost-exe
        path: publish/ZytechBoost.exe
        retention-days: 30

    - name: Upload debug artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: ZytechBoost-debug
        path: |
          ZytechBoost/bin/Release/net8.0-windows/**/*.pdb
        retention-days: 7
        if-no-files-found: ignore
